name: sh
channels:
  - defaults
  - conda-pypi
dependencies:
  # Keep the interpreter pin in step with the canonical `mkct4oqs` pin and with
  # `dmrg4oqs`: the same interpreter builds all three environments, and the pin
  # moves deliberately (dependabot ignores patch releases of `python`).
  - python=3.15
  - pip:
    - -r requirements.txt   # unpinned: always the latest
