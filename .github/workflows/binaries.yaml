name: Binaries
run-name: Binaries · ${{ github.event.workflow_run.head_sha || github.sha }}

# Frozen distributions of one driver for linux-x64, linux-arm64 and macos-arm64.
# Triggered by the CI workflow finishing green on `main` (a broken commit must
# never publish a binary), and manually for a rebuild.  Assets go to a release
# tagged `bin-<sha7>`: tag and commit are the same object, and the download
# script derives the tag from `git rev-parse`, so source and binary cannot drift.
#
# Linux builds run inside manylinux_2_28 (glibc 2.28): the cluster is Rocky 9.6
# / glibc 2.34, and a binary built on ubuntu-22.04 (2.35) or ubuntu-24.04 (2.39)
# does not start there.  The elfless check is two-sided: every bundled ELF is
# audited for its highest GLIBC_ symbol, and the packed tarball is then run in a
# bare rockylinux:9 container with no Python at all.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: binaries-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

env:
  DRIVER: sh
  # The portability smoke run in the bare Rocky 9 container (no Python there, so
  # a real but tiny run with the configs mounted read-only; the numeric check is
  # tools/verify_binary.py, run on the build machine).
  SMOKE: "A-base_line -method mash -config-dir /c -n_traj 100 -N 4 -dt 0.05 -nproc 1 -njobs 1 -outdir /tmp/d"
  PYTHON_VERSION: "3.14"
  PYINSTALLER: "6.22.3"
  # The Linux interpreter: python-build-standalone's shared cp314, pinned so the
  # manylinux build does not move under us (the image's own /opt/python is static).
  PBS_RELEASE: "20261110"
  PBS_VERSION: "3.14.10"

jobs:
  release:
    name: Release bin-<sha7>
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - name: Pick the commit and tag
        id: pick
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "tag=bin-${SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Create the release (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.pick.outputs.tag }}
          SHA: ${{ steps.pick.outputs.sha }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" \
                 --target "$SHA" --title "$DRIVER $TAG" \
                 --notes "Frozen \`$DRIVER\` binaries built from $SHA."

  macos:
    name: macos-arm64
    needs: release
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.sha }}

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: source/requirements.txt

      - name: Install the build environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r source/requirements.txt "pyinstaller==$PYINSTALLER"

      - name: Build, verify, pack
        run: bash tools/build_binary.sh "$DRIVER"

      - name: Publish the asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" \
            dist/*.tar.gz dist/*.sha256 dist/*.json --clobber

  linux:
    name: ${{ matrix.platform }}
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x64
            image: quay.io/pypa/manylinux_2_28_x86_64
          - os: ubuntu-22.04-arm
            platform: linux-arm64
            image: quay.io/pypa/manylinux_2_28_aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.sha }}

      # The image's own /opt/python is built without a shared libpython, which
      # PyInstaller refuses ("Python was built without a shared library"), so the
      # interpreter is python-build-standalone's cp314: shared libpython, glibc
      # 2.17 symbols (measured), therefore inside the image's 2.28 floor.  The
      # assertion turns a future regression into a clear failure instead of a
      # confusing PyInstaller error.
      - name: Build in manylinux_2_28
        env:
          IMAGE: ${{ matrix.image }}
          SHA: ${{ needs.release.outputs.sha }}
        run: |
          docker run --rm -v "$PWD:/work" -w /work -e DRIVER="$DRIVER" \
            -e PYINSTALLER="$PYINSTALLER" -e PBS_RELEASE="$PBS_RELEASE" \
            -e PBS_VERSION="$PBS_VERSION" -e OQS_SHA="$SHA" \
            "$IMAGE" bash -lc '
              set -euo pipefail
              case "$(uname -m)" in
                x86_64)  pbs_arch=x86_64 ;;
                aarch64) pbs_arch=aarch64 ;;
                *) echo "unsupported arch $(uname -m)"; exit 1 ;;
              esac
              url="https://github.com/astral-sh/python-build-standalone/releases/download/${PBS_RELEASE}/cpython-${PBS_VERSION}%2B${PBS_RELEASE}-${pbs_arch}-unknown-linux-gnu-install_only.tar.gz"
              curl -LsSf -o /tmp/pbs.tgz "$url"
              tar -xzf /tmp/pbs.tgz -C /tmp
              PY=/tmp/python/bin/python
              "$PY" -c "import sysconfig, sys; sys.exit(0 if sysconfig.get_config_var(\"Py_ENABLE_SHARED\") else 1)" \
                || { echo "interpreter $PY has no shared libpython"; exit 1; }
              # teNPy ships no cp314 aarch64 wheel, so the C helper is built from
              # source, and the standalone sysconfig names clang++ (absent here).
              if ! command -v g++ > /dev/null 2>&1; then dnf install -y gcc-c++ > /dev/null; fi
              export CC=gcc CXX=g++
              "$PY" -m pip install --quiet --upgrade pip
              "$PY" -m pip install --quiet -r source/requirements.txt \
                "pyinstaller==$PYINSTALLER"
              PYTHON="$PY" bash tools/build_binary.sh "$DRIVER"
            '
          sudo chown -R "$(id -u):$(id -g)" dist

      - name: Audit the glibc floor
        run: |
          max=$(find "dist/$DRIVER" -type f \( -perm -u+x -o -name '*.so*' \) \
                  -exec objdump -T {} + 2>/dev/null \
                | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1)
          echo "highest glibc symbol: ${max:-none}"
          [ -n "$max" ] || { echo "no ELF symbol table found"; exit 1; }
          [ "$(printf '%s\n%s\n' GLIBC_2.28 "$max" | sort -V | tail -1)" = GLIBC_2.28 ] \
            || { echo "FAIL: $max needs a newer glibc than 2.28"; exit 1; }

      - name: Run the tarball in a bare Rocky 9 (the cluster's glibc 2.34)
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          docker run --rm -e DRIVER="$DRIVER" -e PLATFORM="$PLATFORM" \
            -e SMOKE="$SMOKE" -v "$PWD/dist:/d:ro" -v "$PWD/source/config:/c:ro" \
            rockylinux:9 bash -lc '
            set -euo pipefail
            mkdir -p /tmp/x && tar -xzf "/d/$DRIVER-$PLATFORM.tar.gz" -C /tmp/x
            "/tmp/x/$DRIVER/$DRIVER" --version
            mkdir -p /tmp/d
            "/tmp/x/$DRIVER/$DRIVER" $SMOKE
            find /tmp/d -name "*.npz" | head -3
            find /tmp/d -name "*.npz" | grep -q . || { echo "no archive written"; exit 1; }
          '

      - name: Publish the asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" \
            dist/*.tar.gz dist/*.sha256 dist/*.json --clobber
